# The whole app in containers, as in production:
#   docker compose -f docker-compose.prod.yml up --build
# Needs ACCESS_TOKEN_SECRET in .env (see .env.example). Open http://localhost:3000
name: collab-board-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collab}
      POSTGRES_DB: collab_board
    # No "ports": the database is reachable only from the other containers
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab_board"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      # "postgres" is the service name: containers find each other by name
      DATABASE_URL: postgresql://collab:${POSTGRES_PASSWORD:-collab}@postgres:5432/collab_board
      CORS_ORIGIN: ${WEB_URL:-http://localhost:3000}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env}
      LOG_LEVEL: info
    ports:
      - "${SERVER_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy # wait until the database accepts connections
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser code at build time
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://localhost:4000/ws}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
