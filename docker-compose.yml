# Local development services. Run: pnpm services:up
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
      POSTGRES_DB: collab_board
    ports:
      # 5433 on the host, so it does not clash with another local PostgreSQL
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab_board"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
